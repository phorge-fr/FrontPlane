apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: gitea
    namespace: gitea
spec:
    chart:
        spec:
            chart: gitea
            sourceRef:
                kind: HelmRepository
                name: gitea
            version: '*'
    interval: 1m0s
    timeout: 10m0s
    values:
        postExtraInitContainers:
            - name: phorge-theme-install
              image: alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache rsync wget unzip
                  mkdir -p /data/gitea
                  wget -O /tmp/main.zip https://github.com/phorge-fr/gitea-phorge-theme/archive/refs/heads/main.zip
                  unzip -n /tmp/main.zip -d /tmp/
                  rsync -a --inplace --checksum /tmp/gitea-phorge-theme-main/ /data/gitea/
                  chown -R 1000:1000 /data/gitea
                  chmod -R 777 /data/packages
                  chmod -R 777 /data/lfs
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: packages-volume
                  mountPath: /data/packages
                - name: lfs-volume
                  mountPath: /data/lfs
        nodeSelector:
            node-role.kubernetes.io/worker: "true"
        extraVolumes:
            - name: packages-volume
              persistentVolumeClaim:
                claimName: gitea-packages-pvc
            - name: lfs-volume
              persistentVolumeClaim:
                claimName: gitea-lfs-pvc
        extraVolumeMounts:
            - name: packages-volume
              mountPath: /data/packages
            - name: lfs-volume
              mountPath: /data/lfs
        gitea:
            admin:
                email: ENC[AES256_GCM,data:nl2w+Is7JYS8nu7fm5JtWw==,iv:fkl52nlxzwLBQo1RHcxqNT1Y+LNegYVgz+GCcO+0PfI=,tag:UECGbBtytGmXXpk4CPvawg==,type:str]
                password: ENC[AES256_GCM,data:wuixGu+0qV+iLDokV29Upd3HrAw=,iv:eSN0jMag2riXdcJHL6AJ1kyTpySJIf0EdOsegAylcvw=,tag:kjSeVId/Vad8NkfSAK4Fxw==,type:str]
                passwordMode: keepUpdated
                username: ENC[AES256_GCM,data:25TU3W0j94eXMjk=,iv:F1TzFqKtS/4wGQgH7EJHe26w2z4WfbR7kI3AFNnF/zY=,tag:wklT3oPF2GOiTwJoOKJM3Q==,type:str]
            config:
                APP_NAME: φorge
                server:
                    SSH_LISTEN_PORT: 2222
                    SSH_PORT: 22
                    ROOT_URL: https://git.phorge.fr/
                service:
                    DISABLE_REGISTRATION: "true"
                ui:
                    THEMES: phorge-dark
                    DEFAULT_THEME: phorge-dark
                repository:
                    ACCESS_CONTROL_ALLOW_ORIGIN: '*'
                storage: {}
        ingress:
            annotations:
                # cert-manager.io/cluster-issuer: letsencrypt # temporarily disabled to use a self-signed certificate, as I hit rate limits with Let's Encrypt
                nginx.ingress.kubernetes.io/proxy-body-size: 20480m
            className: nginx
            enabled: true
            hosts:
                - host: git.phorge.fr
                  paths:
                    - path: /
            pathType: Prefix
            tls:
                - hosts:
                    - git.phorge.fr
                  secretName: gitea-tls
        persistence:
            accessModes:
                - ReadWriteOnce
            annotations:
                helm.sh/resource-policy: keep
            claimName: gitea-shared-storage
            create: true
            enabled: true
            labels: {}
            mount: true
            size: 10Gi
            storageClass: null
            subPath: null
            volumeName: ""
        postgresql:
            enabled: true
            global:
                postgresql:
                    auth:
                        database: gitea
                        password: ENC[AES256_GCM,data:F3vJ5xI=,iv:HMi07B+nxhzV9g4YsV+gyHIjdtlyyGgZ5eV4hWSZREY=,tag:yynGCwfMbX9wOfxUdG6ICQ==,type:str]
                        username: ENC[AES256_GCM,data:+86FCKM=,iv:KLBuRKDZcnUbKbtNxMpiX5MdzY3VK9jiRMp/KuKbq0Y=,tag:LWawM1iDazfimesrXfEE+g==,type:str]
                    service:
                        ports:
                            postgresql: 5432
            image:
                repository: bitnamilegacy/postgresql
            metrics:
                image:
                    repository: bitnamilegacy/postgres-exporter
            primary:
                nodeSelector:
                    node-role.kubernetes.io/worker: "true"
                persistence:
                    size: 4Gi
            volumePermissions:
                image:
                    repository: bitnamilegacy/os-shell
        postgresql-ha:
            enabled: false
        service:
            ssh:
                annotations: {}
                clusterIP: None
                externalIPs: null
                externalTrafficPolicy: null
                hostPort: null
