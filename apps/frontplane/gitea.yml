apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: gitea
    namespace: gitea
spec:
    chart:
        spec:
            chart: gitea
            sourceRef:
                kind: HelmRepository
                name: gitea
            version: '*'
    interval: 1m0s
    timeout: 10m0s
    values:
        postExtraInitContainers:
            - name: phorge-theme-install
              image: alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache rsync wget unzip
                  mkdir -p /data/gitea
                  wget -O /tmp/main.zip https://github.com/phorge-fr/gitea-phorge-theme/archive/refs/heads/main.zip
                  unzip -n /tmp/main.zip -d /tmp/
                  rsync -a --inplace --checksum /tmp/gitea-phorge-theme-main/ /data/gitea/
                  chown -R 1000:1000 /data/gitea
                #   chmod -R 777 /data/packages
                #   chmod -R 777 /data/lfs
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: packages-volume
                  mountPath: /data/packages
                - name: lfs-volume
                  mountPath: /data/lfs
        nodeSelector:
            node-role.kubernetes.io/worker: "true"
        extraVolumes:
            - name: packages-volume
              persistentVolumeClaim:
                claimName: gitea-packages-pvc
            - name: lfs-volume
              persistentVolumeClaim:
                claimName: gitea-lfs-pvc
        extraVolumeMounts:
            - name: packages-volume
              mountPath: /data/packages
            - name: lfs-volume
              mountPath: /data/lfs
        gitea:
            admin:
                email: ENC[AES256_GCM,data:A4XZqpM0HlZl4jsm2LMkEQ==,iv:znnr7TI4Wv4+sibMy9UHwM276rK6XNvNmgsTU2josZs=,tag:6aH2RY6zco6/IEYXRy+IhQ==,type:str]
                password: ENC[AES256_GCM,data:OZQnCSGJO64BQOK0op2vV37oIPA=,iv:lup34Eyeu69ITvDCjKbFABrX4R1tzPvVhTIVU16be24=,tag:eQmpiqtDqrENW199cPMp5g==,type:str]
                passwordMode: keepUpdated
                username: ENC[AES256_GCM,data:G2bMQWHd1hsrYn8=,iv:QudC2RCT68p/ExUrodGkY7q0QhltAqEaxsvJ+6OZm8g=,tag:AOLBJDH9LUMiNq9+wfFkRQ==,type:str]
            config:
                APP_NAME: φorge
                server:
                    SSH_LISTEN_PORT: 2222
                    SSH_PORT: 22
                    ROOT_URL: https://git.phorge.fr/
                service:
                    DISABLE_REGISTRATION: "true"
                ui:
                    THEMES: phorge-dark
                    DEFAULT_THEME: phorge-dark
                repository:
                    ACCESS_CONTROL_ALLOW_ORIGIN: '*'
                storage: {}
        ingress:
            annotations:
                cert-manager.io/cluster-issuer: letsencrypt
            className: traefik-public
            enabled: true
            hosts:
                - host: git.phorge.fr
                  paths:
                    - path: /
            pathType: Prefix
            tls:
                - hosts:
                    - git.phorge.fr
                  secretName: gitea-tls
        persistence:
            accessModes:
                - ReadWriteOnce
            annotations:
                helm.sh/resource-policy: keep
            claimName: gitea-shared-storage
            create: true
            enabled: true
            labels: {}
            mount: true
            size: 10Gi
            storageClass: null
            subPath: null
            volumeName: ""
        postgresql:
            enabled: true
            global:
                postgresql:
                    auth:
                        database: gitea
                        password: ENC[AES256_GCM,data:9Jcfwsc=,iv:RvS21/zqcu81twFP5BLNAcVRHwegJ+wb9T3O/nDmco8=,tag:HsarHozLD35vgbdJ/FxkSg==,type:str]
                        username: ENC[AES256_GCM,data:UpX05/U=,iv:/Fz5+hFYvkdY+AskbXfyrSslBUjwcvVAJShyf0u1DWc=,tag:0AZc/5CJorqHBrzabzqOtA==,type:str]
