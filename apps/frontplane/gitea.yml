apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: gitea
    namespace: gitea
spec:
    chart:
        spec:
            chart: gitea
            sourceRef:
                kind: HelmRepository
                name: gitea
            version: '*'
    interval: 1m0s
    timeout: 10m0s
    values:
        postExtraInitContainers:
            - name: phorge-theme-install
              image: alpine
              command:
                - sh
                - -c
                - |
                  set -e
                  apk add --no-cache rsync wget unzip
                  mkdir -p /data/gitea
                  wget -O /tmp/main.zip https://github.com/phorge-fr/gitea-phorge-theme/archive/refs/heads/main.zip
                  unzip -n /tmp/main.zip -d /tmp/
                  rsync -a --inplace --checksum /tmp/gitea-phorge-theme-main/ /data/gitea/
                  chown -R 1000:1000 /data/gitea
                  chmod -R 777 /data/packages
                  chmod -R 777 /data/lfs
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: packages-volume
                  mountPath: /data/packages
                - name: lfs-volume
                  mountPath: /data/lfs
        nodeSelector:
            node-role.kubernetes.io/worker: "true"
        extraVolumes:
            - name: packages-volume
              persistentVolumeClaim:
                claimName: gitea-packages-pvc
            - name: lfs-volume
              persistentVolumeClaim:
                claimName: gitea-lfs-pvc
        extraVolumeMounts:
            - name: packages-volume
              mountPath: /data/packages
            - name: lfs-volume
              mountPath: /data/lfs
        gitea:
            admin:
                email: ENC[AES256_GCM,data:YKaTd5nw6dFGYi5AIeIZ9g==,iv:xDw6yfMxZopWvb5G6nC/W8jGv0gr6I4GqgHeUqWj8UM=,tag:Z9fa/ETMEH8BHJxgSn3knw==,type:str]
                password: ENC[AES256_GCM,data:ns4zPEHR/qDCocWMtRWUbYblhto=,iv:5m/TOKaovZ1e4mI4lwM0PSAPUxaeNrHJvbH6Uufv7qE=,tag:D8A0f/yaOPK/ZFB2cNMx9Q==,type:str]
                passwordMode: keepUpdated
                username: ENC[AES256_GCM,data:4bQEBdxQD+LPVOw=,iv:vj+t+hHLY23XF2ee9t1eGBUCJ4yPSyEm4B7eB+J5yQI=,tag:8sIPEmVqLGCp7tfZzI8WHQ==,type:str]
            config:
                APP_NAME: φorge
                server:
                    SSH_LISTEN_PORT: 2222
                    SSH_PORT: 22
                    ROOT_URL: https://git.phorge.fr/
                service:
                    DISABLE_REGISTRATION: "true"
                ui:
                    THEMES: phorge-dark
                    DEFAULT_THEME: phorge-dark
                repository:
                    ACCESS_CONTROL_ALLOW_ORIGIN: '*'
                storage: {}
        ingress:
            annotations:
                cert-manager.io/cluster-issuer: letsencrypt
            className: traefik-public
            enabled: true
            hosts:
                - host: git.phorge.fr
                  paths:
                    - path: /
            pathType: Prefix
            tls:
                - hosts:
                    - git.phorge.fr
                  secretName: gitea-tls
        persistence:
            accessModes:
                - ReadWriteOnce
            annotations:
                helm.sh/resource-policy: keep
            claimName: gitea-shared-storage
            create: true
            enabled: true
            labels: {}
            mount: true
            size: 10Gi
            storageClass: null
            subPath: null
            volumeName: ""
        postgresql:
            enabled: true
            global:
                postgresql:
                    auth:
                        database: gitea
                        password: ENC[AES256_GCM,data:O4bT2Lw=,iv:WJambHJOpbTQdZEF6qNEFGfZiK4ItlJpJGhVTSMf9fI=,tag:nplov0osSw/gKRwtuc+Qcw==,type:str]
                        username: ENC[AES256_GCM,data:eag0Y4w=,iv:eawcwOMnv8cbqsJwy+DY0Jk+2C29sZrQ4n49MFVTlxs=,tag:8P0yXGxO6YWdWt9r+VFV0w==,type:str]
                    service:
                        ports:
                            postgresql: 5432
            image:
                repository: bitnamilegacy/postgresql
            metrics:
                image:
                    repository: bitnamilegacy/postgres-exporter
            primary:
                nodeSelector:
                    node-role.kubernetes.io/worker: "true"
                persistence:
                    size: 4Gi
            volumePermissions:
                image:
                    repository: bitnamilegacy/os-shell
        postgresql-ha:
            enabled: false
        service:
            ssh:
                annotations: {}
                clusterIP: None
