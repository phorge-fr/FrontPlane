apiVersion: apps/v1
kind: Deployment
metadata:
    name: litellm-deployment
    namespace: litellm
spec:
    replicas: 1
    selector:
        matchLabels:
            app: litellm
    template:
        metadata:
            labels:
                app: litellm
        spec:
            containers:
                - name: litellm-container
                  image: docker.litellm.ai/berriai/litellm:main-stable
