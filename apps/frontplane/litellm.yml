apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres-deployment
    namespace: litellm
spec:
    replicas: 1
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            nodeSelector:
                node-role.kubernetes.io/worker: "true"
            containers:
                - name: postgres
                  image: postgres:16-alpine
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: POSTGRES_USER
                      value: litellm
                    - name: POSTGRES_PASSWORD
                      value: litellm
                    - name: POSTGRES_DB
                      value: litellm
                  ports:
                    - containerPort: 5432
                      name: postgres
                  volumeMounts:
                    - name: postgres-storage
                      mountPath: /var/lib/postgresql/data
                      subPath: postgres
                  livenessProbe:
                    exec:
                        command:
                            - /bin/sh
                            - -c
                            - pg_isready -U litellm
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  readinessProbe:
                    exec:
                        command:
                            - /bin/sh
                            - -c
                            - pg_isready -U litellm
                    initialDelaySeconds: 5
                    periodSeconds: 10
            volumes:
                - name: postgres-storage
                  persistentVolumeClaim:
                    claimName: postgres-pvc
