apiVersion: v1
kind: Namespace
metadata:
    name: phorge-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
    labels:
        run: website
    name: website
    namespace: phorge-web
spec:
    replicas: 1
    selector:
        matchLabels:
            run: website
    template:
        metadata:
            labels:
                run: website
        spec:
            containers:
                - name: website
                  image: git.phorge.fr/phorge/phorge.fr:latest
                  ports:
                    - containerPort: 80
                  resources:
                    requests:
                        memory: 64Mi
                        cpu: 100m
                    limits:
                        memory: 256Mi
                        cpu: 1000m
---
apiVersion: v1
kind: Service
metadata:
    name: website-svc
    namespace: phorge-web
spec:
    selector:
        run: website
    ports:
        - name: http
          port: 80
          targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: website-ing
    namespace: phorge-web
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt
spec:
    ingressClassName: traefik-public
    tls:
        - hosts:
            - phorge.fr
            - www.phorge.fr
          secretName: phorge.fr
    rules:
        - host: phorge.fr
          http:
            paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                        name: website-svc
                        port:
                            number: 80
        - host: www.phorge.fr
          http:
            paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                        name: website-svc
                        port:
                            number: 80
