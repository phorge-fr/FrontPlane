apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-public
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  values:
    fullnameOverride: traefik-public
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-public
    providers:
      kubernetesIngress:
        ingressClass: traefik-public
    service:
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "10.0.0.11"
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true