apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
    name: iaas-provider-config
spec:
    deploymentTemplate:
        spec:
            selector: {}
            replicas: 1
            template:
                spec:
                    volumes:
                        - name: incus-config
                          secret:
                            secretName: ENC[AES256_GCM,data:Vo5KYYFuqDcNnsOmoLzExeLj/Q==,iv:GS+TPU7XmC+Jq9kurZeWFPdowPmeycMJOujFzeYrulE=,tag:Ps9hK9cp+TYiWj/859Hwqw==,type:str]
                    containers:
                        - name: package-runtime
                          command:
                            - sh
                            - -c
                            - |
                              mkdir -p /tofu/config/incus \
                              && cp -L /tmp/credentials/* /tofu/config/incus/ \
                              && crossplane-opentofu-provider
                          volumeMounts:
                            - name: incus-config
                              mountPath: /tmp/credentials
