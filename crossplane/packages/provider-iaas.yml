apiVersion: opentofu.upbound.io/v1beta1
kind: ProviderConfig
metadata:
    name: iaas
spec:
    configuration: |
        terraform {
          required_providers {
            incus = {
              source = "lxc/incus"
              version = "1.0.2"
            }
          }
          backend "kubernetes" {
            secret_suffix     = "providerconfig-default"
            namespace         = "crossplane-system"
            in_cluster_config = true
          }
        }

        provider "incus" {
          accept_remote_certificate = true
          default_remote            = "iaas"
          config_dir                = "/tofu/config/incus"
          remote {
            name    = "iaas"
            address = "https://iaas.phorge.fr:443"
          }
        }
