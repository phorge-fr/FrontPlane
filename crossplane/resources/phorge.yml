apiVersion: iaas.phorge.fr/v1alpha1
kind: Instance
metadata:
    name: rustfs-s3-main
spec:
    name: rustfs-s3-main
    image: images:alpine/3.23/cloud
    description: RustFS S3 main instance
    project: Phorge
    type: virtual-machine
    running: true
    config:
        limits.cpu: "1"
        limits.memory: 1024MiB
        security.secureboot: "false"
        cloud-init.user-data: ENC[AES256_GCM,data:,iv:5VRwTnVVZ/dIrF+FktkckQo5Vvoq5WPK8CpwhShRwlY=,tag:p3jE6gnb+l1Jb+PpLaRrjQ==,type:str]
    devices:
        - name: root
          type: disk
          properties:
            pool: local
            path: /
            size: 100GiB
        - name: eth0
          type: nic
          properties:
            network: Main
