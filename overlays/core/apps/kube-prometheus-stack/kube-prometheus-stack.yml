apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: kube-prometheus-stack
    namespace: kube-prometheus-stack
spec:
    chart:
        spec:
            chart: kube-prometheus-stack
            sourceRef:
                kind: HelmRepository
                name: kube-prometheus-stack
            version: '*'
    interval: 1m0s
    values:
        grafana:
            envFromSecret: grafana-oauth-secret
            grafana.ini:
                auth.generic_oauth:
                    enabled: true
                    name: Phorge
                    allow_sign_up: true
                    client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
                    client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
                    scopes: openid profile email groups offline_access
                    auth_url: https://auth.phorge.fr/application/o/authorize/
                    token_url: https://auth.phorge.fr/application/o/token/
                    api_url: https://auth.phorge.fr/application/o/userinfo/
                    login_attribute_path: preferred_username
                    name_attribute_path: name
                    email_attribute_path: email
                    role_attribute_path: contains(groups[*], 'grafana-admins') && 'Admin' || 'Viewer'
                    use_pkce: true
                server:
                    domain: monitoring.phorge.fr
                    root_url: https://monitoring.phorge.fr/
            enabled: true
            adminPassword: ENC[AES256_GCM,data:YBu6WhmMEY/ZvrdK5QKOHN+xDuAu9u7i,iv:cMhvgvDCm5vB6o9brQ5+zbbbjvVcH8PHSZ/5kDTXEKU=,tag:ztOEaQkBpxC9XuwB2TsMdw==,type:str]
            service:
                type: ClusterIP
            ingress:
                enabled: true
                ingressClassName: traefik-public
                annotations:
                    cert-manager.io/cluster-issuer: public-issuer
                hosts:
                    - monitoring.phorge.fr
                tls:
                    - secretName: grafana-tls
                      hosts:
                        - monitoring.phorge.fr
            persistence:
                enabled: false
            grafana:
                sidecar:
                    dashboards:
                        enabled: true
                        label: grafana_dashboard
                        labelValue: "1"
                        searchNamespace: kube-prometheus-stack
                        folder: /tmp/dashboards
                        enableDeletion: true
            additionalDataSources:
                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki.loki.svc.cluster.local:3100
                  isDefault: false
                  jsonData:
                    timeout: 60
                    maxLines: 1000
        prometheus:
            prometheusSpec:
                retention: 30d
                retentionSize: 35GiB
                enableRemoteWriteReceiver: true
                storageSpec:
                    volumeClaimTemplate:
                        spec:
                            storageClassName: longhorn
                            accessModes:
                                - ReadWriteOnce
                            resources:
                                requests:
                                    storage: 40Gi
